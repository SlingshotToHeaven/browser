name: Android browser recovery and privacy

on:
  push:
    branches: [arena/bb0ffed3-browser]
    paths:
      - .github/workflows/android-browser-recovery.yml
      - tools/check_android_browser_recovery.py
      - tests/fixtures/browser_recovery.py
      - tests/test_android_browser_recovery.py
      - app/src/androidTest/java/com/privacy/browser/BrowserPrivacyCiTest.java
      - 'app/src/androidTest/java/com/privacy/browser/BrowserRecoveryCi*.java'
      - app/src/androidTest/java/com/privacy/browser/TabSessionDeviceTest.java
      - app/src/androidTest/java/com/privacy/browser/BrowserViewLifecycleTest.java

permissions:
  contents: read

concurrency:
  group: android-browser-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-recovery:
    name: Session, renderer and privacy on one API 34 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and run the browser recovery batch
        shell: bash
        run: |
          log="$RUNNER_TEMP/browser-recovery-step.log"
          if bash tools/android_emulator_poc.sh browser-recovery 2>&1 | tee "$log"; then
            exit 0
          else
            status=$?
          fi
          # Include short setup/compile failures even if Actions log archives are not reachable.
          python3 -B - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          tail = '\n'.join(line for line in lines if not line.startswith('::notice'))[-3000:]
          tail = re.sub(r'(https?://[^\s?]+)\?[^\s]+', r'\1', tail)
          tail = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:3600]
          print(f'::error title=Browser recovery batch encountered a failure::{tail or "See the job result"}')
          PY
          exit "$status"
      - name: Retain compact browser recovery results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-browser-recovery
          path: ${{ runner.temp }}/browser-emulator-poc/proof/browser-recovery.json
          if-no-files-found: warn
          retention-days: 1
