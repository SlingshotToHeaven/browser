name: Android emulator download upgrade and sharing

# This branch-scoped runtime batch replaces the prior publication-only CI run.
# The original download-publication and launch modes remain in the runner.
on:
  push:
    branches: [arena/bb0ffed3-browser]
    paths:
      - .github/workflows/android-emulator-poc.yml
      - tools/android_emulator_poc.sh
      - tools/check_android_download_publication.py
      - tools/check_android_download_upgrade.py
      - tools/prepare_perf_baselines.py
      - tests/fixtures/download_upgrade/**
      - tests/fixtures/perf_baselines/**

permissions:
  contents: read

concurrency:
  group: android-emulator-browser-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download-upgrade:
    name: Replace v7 in place and exercise Android Open and Share
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Build, boot one AVD, and exercise the installed schema upgrade and URI delivery
        shell: bash
        run: |
          log="$RUNNER_TEMP/browser-emulator-step.log"
          if bash tools/android_emulator_poc.sh download-upgrade 2>&1 | tee "$log"; then
            exit 0
          else
            status=$?
          fi
          # Keep bounded diagnostics available when the CI log archive is not downloadable.
          python3 -B - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path

          tail = Path(sys.argv[1]).read_text(errors='replace')[-3000:]
          tail = re.sub(r'(https?://[^\s?]+)\?[^\s]+', r'\1', tail)
          tail = tail.strip().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:3600]
          print(f'::error title=Android download upgrade and sharing check did not pass::{tail or "See the job result"}')
          PY
          exit "$status"
      - name: Retain only the small download result record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-download-upgrade
          path: ${{ runner.temp }}/browser-emulator-poc/proof/download-upgrade.json
          if-no-files-found: warn
          retention-days: 1
