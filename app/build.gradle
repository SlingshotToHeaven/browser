plugins {
    id 'com.android.application'
}

android {
    namespace 'com.privacy.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.browser"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Build unsigned. Align and sign explicitly with an owner-managed key outside Gradle.
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(':downloader')
    implementation project(':image-search')
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jsoup:jsoup:1.18.1'
    // Jsoup declares JSpecify as provided; keep its annotation types resolvable by R8.
    implementation 'org.jspecify:jspecify:1.0.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
