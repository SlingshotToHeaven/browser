name: Android download test batch

# One hosted emulator for the batch; no dispatch on main or on a handset.
on:
  push:
    branches: [arena/bb0ffed3-browser]
    # Shared emulator setup is also used for browser recovery. Only download
    # inputs should trigger this download-specific batch.
    paths:
      - tools/check_android_download_batch.py
      - tools/record_download_batch_host.py
      - tests/fixtures/download_batch.py
      - tests/test_android_download_batch.py
      - 'app/src/androidTest/java/com/privacy/browser/**/*Download*Batch*.java'
      - app/src/androidTest/java/com/privacy/browser/downloads/DownloadHistoryDeviceTest.java
      - app/src/androidTest/java/com/privacy/browser/downloads/CompletedDownloadGrantTest.java
      - app/src/androidTest/java/com/privacy/browser/MediaDiscoveryDeviceTest.java

permissions:
  contents: read

concurrency:
  group: android-emulator-browser-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download-batch:
    name: Run download checks on one API 34 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and run the requested Downloads coverage
        shell: bash
        env:
          ANDROID_DOWNLOAD_SCOPE: ${{ contains(github.event.head_commit.message, '[download-frame-recheck]') && 'frame-recheck' || 'all' }}
        run: |
          log="$RUNNER_TEMP/browser-emulator-step.log"
          if bash tools/android_emulator_poc.sh download-batch 2>&1 | tee "$log"; then
            exit 0
          else
            status=$?
          fi
          # Preserve a short build/setup diagnostic if the log archive is unavailable.
          python3 -B - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          tail = '\n'.join(line for line in lines if not line.startswith('::notice'))[-3200:]
          tail = re.sub(r'(https?://[^\s?]+)\?[^\s]+', r'\1', tail)
          tail = tail.strip().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:3600]
          print(f'::error title=Download batch encountered a failure::{tail or "See the job result"}')
          PY
          exit "$status"
      - name: Retain compact host and device result records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-download-batch
          path: ${{ runner.temp }}/browser-emulator-poc/proof/download-*.json
          if-no-files-found: warn
          retention-days: 1
