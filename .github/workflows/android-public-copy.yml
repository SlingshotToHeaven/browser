name: Android public Downloads interruption

on:
  push:
    branches: [arena/bb0ffed3-browser]
    paths:
      - .github/workflows/android-public-copy.yml
      - tools/check_android_public_copy.py
      - tests/test_android_public_copy.py
      - app/src/androidTest/java/com/privacy/browser/PublicCopyFixtureCiTest.java

permissions:
  contents: read

concurrency:
  group: android-public-copy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-copy:
    name: Interrupt exclusive publication in public Downloads on API 34
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Check partial publication, refusal and exact Retry
        shell: bash
        run: |
          log="$RUNNER_TEMP/public-copy.log"
          if bash tools/android_emulator_poc.sh public-copy 2>&1 | tee "$log"; then
            exit 0
          else
            status=$?
          fi
          python3 -B - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          raw = '\n'.join(line for line in lines if not line.startswith('::notice'))[-2400:]
          raw = re.sub(r'(https?://[^\s?]+)\?[^\s]+', r'\1', raw)
          print('::error title=Public Downloads follow-up failed::' + raw.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:3500])
          PY
          exit "$status"
      - name: Retain public Downloads proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-public-copy
          path: ${{ runner.temp }}/browser-emulator-poc/proof/android-public-copy.json
          if-no-files-found: warn
          retention-days: 1
