name: Android functional follow-up

on:
  push:
    branches: [arena/bb0ffed3-browser]
    paths:
      - .github/workflows/android-functional-followup.yml
      - tools/check_android_functional_followup.py
      - tests/fixtures/blob_frame_followup.py
      - tests/test_android_functional_followup.py
      - app/src/androidTest/java/com/privacy/browser/BrowserFollowupCiTest.java

permissions:
  contents: read

concurrency:
  group: android-functional-followup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional-followup:
    name: Scoped functional follow-up on one API 34 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and exercise Android functional cases
        # The optional commit marker runs only the two diagnostic follow-ups.
        env:
          ANDROID_FUNCTIONAL_SCOPE: ${{ contains(github.event.head_commit.message, '[functional-recheck]') && 'recheck' || 'all' }}
        shell: bash
        run: |
          log="$RUNNER_TEMP/functional-followup.log"
          if bash tools/android_emulator_poc.sh functional-followup 2>&1 | tee "$log"; then
            exit 0
          else
            status=$?
          fi
          python3 -B - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          selected = [line for line in lines if re.search(r': (failed|not-run)|^Functional totals:', line)]
          tail = '\n'.join(selected or [line for line in lines if not line.startswith('::notice')])[-2800:]
          tail = re.sub(r'(https?://[^\s?]+)\?[^\s]+', r'\1', tail)
          tail = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:3600]
          print(f'::error title=Functional follow-up did not pass::{tail or "See the job result"}')
          PY
          exit "$status"
      - name: Retain result inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-functional-followup
          path: ${{ runner.temp }}/browser-emulator-poc/proof/android-functional-followup.json
          if-no-files-found: warn
          retention-days: 1
