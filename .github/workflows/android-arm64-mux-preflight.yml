name: ARM64 mux handoff SDK preflight

on:
  push:
    branches: [arena/bb0ffed3-browser]
    paths:
      - .github/workflows/android-arm64-mux-preflight.yml
      - app/src/androidTest/java/com/privacy/browser/downloads/Arm64MuxRetest.java
      - app/src/androidTest/java/com/privacy/browser/downloads/DownloadDeviceLab.java
      - app/src/androidTest/java/com/privacy/browser/DownloadWebViewBatchTest.java
      - tools/run_arm64_mux_retest.py
      - tools/run_download_device_followup.py
      - tools/check_android_download_upgrade.py
      - tests/test_android_download_upgrade.py
      - tests/fixtures/download_publication/PublicationPause.java
      - tests/test_arm64_mux_retest.py
      - tests/test_download_device_followup.py
      - tests/test_download_publication_launcher.py

permissions:
  contents: read

jobs:
  build-only:
    name: Compile the debug and hardware test APKs (no device)
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and inspect the exact handoff source
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=archive
          trap 'code=$?; echo "::error title=ARM64 mux SDK preflight::$stage failed (exit $code)"; exit "$code"' ERR
          work=$(mktemp -d "$RUNNER_TEMP/arm64-mux.XXXXXX")
          git archive "$GITHUB_SHA" | tar -xf - -C "$work"
          cd "$work"
          stage=fixtures
          python3 -B -m unittest discover -s tests -p 'test_arm64_mux_retest.py' -v
          python3 -B -m unittest discover -s tests -p 'test_download_device*.py' -v
          python3 -B -m unittest discover -s tests -p 'test_download_publication_launcher.py' -v
          python3 -B -m unittest discover -s tests -p 'test_android_download_*.py' -v
          sha256sum -c docs/native-arm64.sha256 docs/release-assets-build-inputs.sha256
          stage=SDK
          sdkmanager=$(command -v sdkmanager || true)
          if [[ -z "$sdkmanager" ]]; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then sdkmanager=$candidate; break; fi
            done
          fi
          [[ -n "$sdkmanager" ]]
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-34' 'build-tools;34.0.0'
          stage=Gradle
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
          stage=APK-badging
          PYTHONPATH=tools python3 -B - "$ANDROID_HOME" <<'PY'
          import os
          from pathlib import Path
          import sys
          from check_android_download_upgrade import apk_info
          from run_arm64_mux_retest import apk_badging

          sdk = Path(sys.argv[1])
          aapt2 = sdk / "build-tools/34.0.0/aapt2"
          identities = {}
          for package, name in (("com.browser", "debug/app-debug.apk"),
                                ("com.browser.test", "androidTest/debug/app-debug-androidTest.apk")):
              path = Path("app/build/outputs/apk") / name
              apk_badging(aapt2, path, package)
              identities[package] = apk_info(sdk, path, package)
          app, test = identities["com.browser"], identities["com.browser.test"]
          if app["signer"] != test["signer"]:
              raise SystemExit("Debug app and test APKs must have the same verified signer")
          print(f"::notice title=ARM64 mux handoff build::Source {os.environ['GITHUB_SHA']}; "
                f"debug {app['apk_sha256']}; instrumentation {test['apk_sha256']}; "
                f"verified same signer; parsed test versionCode {test['version_code']}; no device tests or APK upload.")
          PY
